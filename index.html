<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Poppylist · instant mixtape</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="manifest" href="manifest.json">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', sans-serif; }
        body { min-height: 100vh; background: linear-gradient(135deg, #0a0806, #1a120b, #0a0806); display: flex; justify-content: center; align-items: center; padding: 20px; }
        .player-container { width: 860px; max-width: 100%; background: linear-gradient(145deg, #0a0806, #1a120b); border-radius: 32px; box-shadow: 0 0 0 4px #000, 0 25px 45px rgba(0, 0, 0, 0.9), 0 0 15px rgba(169, 113, 66, 0.3); overflow: hidden; display: flex; flex-direction: column; color: #f5f5dc; border: 1px solid #000; }
        .player-main { display: flex; flex-wrap: wrap; padding: 20px; gap: 20px; }
        .player-left { flex: 1.2; min-width: 240px; display: flex; flex-direction: column; gap: 20px; }
        .player-right { flex: 2; min-width: 260px; background: rgba(10, 8, 6, 0.7); border-radius: 24px; backdrop-filter: blur(2px); overflow: hidden; box-shadow: inset 0 0 10px rgba(0,0,0,0.5), 0 5px 15px rgba(0,0,0,0.6); display: flex; flex-direction: column; }
        .header { background: linear-gradient(to bottom, #0a0806, #1a120b); padding: 16px 20px; text-align: center; border-bottom: 1px solid rgba(0,0,0,0.7); position: relative; }
        .header h1 { font-size: 1.7rem; letter-spacing: 2px; color: #e6d5b8; text-shadow: 0 0 10px rgba(169, 113, 66, 0.5); font-weight: 600; }
        .header p { font-size: 0.8rem; color: #d4a373; }
        .now-playing-indicator { position: absolute; top: 12px; right: 20px; background: rgba(212, 163, 115, 0.25); padding: 4px 12px; border-radius: 40px; font-size: 0.7rem; font-weight: 500; backdrop-filter: blur(4px); }
        .album-art { width: 100%; aspect-ratio: 1 / 1; max-width: 240px; margin: 0 auto; border-radius: 50%; background: radial-gradient(circle, #2a1e12, #050302); box-shadow: 0 0 25px rgba(0,0,0,0.8); border: 2px solid rgba(0,0,0,0.6); overflow: hidden; }
        .album-art-inner { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at 30% 30%, #2c1f12, #0a0603); color: #d4a373; font-size: 1rem; font-weight: 500; text-align: center; padding: 20px; }
        .visualizer { background: rgba(0,0,0,0.4); border-radius: 40px; padding: 12px 8px; border: 1px solid rgba(169,113,66,0.3); }
        .bars { display: flex; align-items: flex-end; justify-content: center; gap: 5px; height: 70px; }
        .bar { width: 6px; background: linear-gradient(to top, #8b5a2b, #e6b87e); border-radius: 6px; transition: height 0.08s ease; }
        .song-info { background: rgba(0,0,0,0.35); padding: 12px; border-radius: 20px; text-align: center; }
        .song-info h2 { font-size: 1.2rem; font-weight: 500; color: #f3e5c0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .song-info p { font-size: 0.85rem; color: #d4a373; }
        .progress-container { width: 100%; height: 6px; background: #2a2018; border-radius: 10px; cursor: pointer; margin: 10px 0 5px; }
        .progress { height: 100%; width: 0%; background: linear-gradient(90deg, #b87c41, #e6b87e); border-radius: 10px; }
        .time { display: flex; justify-content: space-between; font-size: 0.75rem; color: #bc9a6b; }
        .controls { display: flex; justify-content: center; align-items: center; gap: 18px; margin: 10px 0; }
        .control-btn { background: linear-gradient(145deg, #0a0806, #1a120b); border: none; color: #e6d5b8; width: 44px; height: 44px; border-radius: 50%; cursor: pointer; box-shadow: 0 4px 8px rgba(0,0,0,0.6); transition: 0.2s; font-size: 1.2rem; }
        .play-btn { width: 58px; height: 58px; background: linear-gradient(145deg, #2c1e12, #8b5a2b); font-size: 1.7rem; box-shadow: 0 0 12px rgba(169,113,66,0.5); }
        .control-btn:hover { transform: scale(1.05); background: #2c1e12; }
        .volume-container { display: flex; align-items: center; gap: 12px; justify-content: center; margin: 8px 0 5px; }
        .volume-slider { width: 130px; -webkit-appearance: none; background: #2a1c10; height: 4px; border-radius: 4px; }
        .volume-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; background: #e6b87e; border-radius: 50%; cursor: pointer; }
        .playlist-header { display: flex; justify-content: space-between; padding: 14px 18px; background: rgba(0,0,0,0.6); font-weight: 600; border-bottom: 1px solid #2c1f12; }
        .playlist-actions { display: flex; gap: 12px; align-items: center; }
        .upload-btn { background: #8b5a2b; border: none; padding: 8px 14px; border-radius: 40px; color: white; font-weight: 500; font-size: 0.8rem; cursor: pointer; transition: 0.2s; }
        .upload-btn:hover { background: #b87c41; }
        .playlist { flex: 1; overflow-y: auto; max-height: 380px; }
        .playlist-item { display: flex; align-items: center; padding: 12px 18px; border-bottom: 1px solid rgba(0,0,0,0.4); cursor: pointer; gap: 12px; transition: 0.1s; }
        .playlist-item.active { background: rgba(139, 90, 43, 0.35); border-left: 3px solid #e6b87e; }
        .song-title-artist { flex: 1; overflow: hidden; }
        .song-title-artist .title { font-weight: 500; font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .song-title-artist .artist { font-size: 0.7rem; color: #bc9a6b; }
        .edit-song, .remove-song { background: none; border: none; cursor: pointer; font-size: 0.9rem; }
        .edit-song { color: #d4a373; margin: 0 4px; }
        .remove-song { color: #b35f2b; font-size: 1rem; }
        .duration { font-size: 0.75rem; color: #a57447; width: 50px; text-align: right; }
        .footer { text-align: center; font-size: 0.7rem; padding: 12px; color: #7a5a3a; border-top: 1px solid #000; }
        .player-stats { display: flex; justify-content: space-around; background: rgba(0,0,0,0.3); border-radius: 28px; padding: 8px; margin-top: 4px; }
        .stat-item { text-align: center; }
        .stat-value { font-weight: 600; color: #e6d5b8; }
        .empty-playlist-msg { text-align: center; padding: 40px 20px; color: #bc9a6b; font-style: italic; }
    </style>
</head>
<body>
<div class="player-container">
    <div class="header">
        <h1>❤️ POPPYLIST · MIXTAPE</h1>
        <p>handpicked for you · 34 tracks</p>
        <div class="now-playing-indicator">♫ NOW PLAYING</div>
    </div>

    <div class="player-main">
        <div class="player-left">
            <div class="album-art">
                <div class="album-art-inner" id="albumTextPlaceholder">🎵 for you<br>with love</div>
            </div>
            <div class="visualizer"><div class="bars" id="visualizerBars"></div></div>
            <div class="song-info">
                <h2 id="currentSongTitle">select a song</h2>
                <p id="currentSongArtist">── click any track ──</p>
            </div>
            <div class="progress-container" id="progressContainer"><div class="progress" id="progressFill"></div></div>
            <div class="time"><span id="currentTime">0:00</span><span id="totalDuration">0:00</span></div>
            <div class="controls">
                <button class="control-btn" id="prevBtn"><i class="fas fa-step-backward"></i></button>
                <button class="control-btn play-btn" id="playPauseBtn"><i class="fas fa-play"></i></button>
                <button class="control-btn" id="nextBtn"><i class="fas fa-step-forward"></i></button>
            </div>
            <div class="controls-row" style="display: flex; justify-content: center; gap: 20px;">
                <button class="control-btn" id="shuffleBtn" style="width: 44px;"><i class="fas fa-random"></i></button>
            </div>
            <div class="volume-container">
                <i class="fas fa-volume-down"></i>
                <input type="range" id="volumeSlider" min="0" max="100" value="75" class="volume-slider">
                <i class="fas fa-volume-up"></i>
            </div>
            <div class="player-stats">
                <div class="stat-item"><span class="stat-value" id="totalSongsCount">34</span><div class="stat-label">SONGS</div></div>
                <div class="stat-item"><span class="stat-value">❤️</span><div class="stat-label">your mix</div></div>
            </div>
        </div>

        <div class="player-right">
            <div class="playlist-header">
                <span>📻 YOUR PLAYLIST (click to play)</span>
                <div class="playlist-actions">
                    <input type="file" id="songFileInput" multiple accept="audio/mpeg,audio/mp3,audio/wav,audio/ogg" style="display: none;">
                    <button class="upload-btn" id="addSongsBtn"><i class="fas fa-plus-circle"></i> Add MP3 files</button>
                </div>
            </div>
            <div class="playlist" id="playlistContainer"></div>
        </div>
    </div>
    <div class="footer">♡ custom mixtape · songs load instantly from GitHub</div>
    <audio id="audioPlayer" preload="metadata"></audio>
</div>

<script>
    (function() {
        // ---------- YOUR SONGS WITH DIRECT RAW GITHUB URLs ----------
           const songList = [
    { title: "altogether", artist: "duster", duration: "5:20", url: "https://alxminermp3.github.io/mp3-ocealx/altogether.mp3" },
    { title: "anhedonia", artist: "duster", duration: "3:15", url: "https://alxminermp3.github.io/mp3-ocealx/anhedonia.mp3" },
    { title: "aqua tofana", artist: "duster", duration: "3:42", url: "https://alxminermp3.github.io/mp3-ocealx/aquatofana.mp3" },   
];
        const audio = document.getElementById('audioPlayer');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const playIcon = playPauseBtn.querySelector('i');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const shuffleBtn = document.getElementById('shuffleBtn');
        const volumeSlider = document.getElementById('volumeSlider');
        const progressContainer = document.getElementById('progressContainer');
        const progressFill = document.getElementById('progressFill');
        const currentTimeSpan = document.getElementById('currentTime');
        const totalDurationSpan = document.getElementById('totalDuration');
        const currentSongTitleSpan = document.getElementById('currentSongTitle');
        const currentSongArtistSpan = document.getElementById('currentSongArtist');
        const playlistDiv = document.getElementById('playlistContainer');
        const totalSongsCountSpan = document.getElementById('totalSongsCount');
        const addSongsBtn = document.getElementById('addSongsBtn');
        const songFileInput = document.getElementById('songFileInput');
        const albumTextDiv = document.getElementById('albumTextPlaceholder');

        // Player state
        let playlist = [];
        let currentIndex = 0;
        let isPlaying = false;
        let shuffleMode = false;
        let audioContext = null;
        let analyser = null;
        let sourceNode = null;
        let animationId = null;
        let barsArray = [];

        // Helper functions
        function formatTime(secs) {
            if (isNaN(secs)) return "0:00";
            const minutes = Math.floor(secs / 60);
            const seconds = Math.floor(secs % 60);
            return `${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
        }

        function initBars() {
            const barsContainer = document.getElementById('visualizerBars');
            barsContainer.innerHTML = '';
            for (let i = 0; i < 18; i++) {
                const bar = document.createElement('div');
                bar.className = 'bar';
                bar.style.height = '6px';
                barsContainer.appendChild(bar);
            }
            barsArray = document.querySelectorAll('.bar');
        }

        function setupAudioContext() {
            if (audioContext && audioContext.state !== 'closed') return;
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            audioContext = new AudioCtx();
            analyser = audioContext.createAnalyser();
            analyser.fftSize = 256;
            const dataArray = new Uint8Array(analyser.frequencyBinCount);
            if (sourceNode) try { sourceNode.disconnect(); } catch(e) {}
            sourceNode = audioContext.createMediaElementSource(audio);
            sourceNode.connect(analyser);
            analyser.connect(audioContext.destination);
            function animate() {
                if (!analyser) return;
                analyser.getByteFrequencyData(dataArray);
                for (let i = 0; i < barsArray.length; i++) {
                    const val = dataArray[i % dataArray.length] || 0;
                    const height = 8 + (val / 255) * 52;
                    barsArray[i].style.height = `${Math.max(6, height)}px`;
                    barsArray[i].style.background = `linear-gradient(to top, #8b5a2b, rgb(${120 + val}, ${100 + val/2}, 80))`;
                }
                animationId = requestAnimationFrame(animate);
            }
            if (animationId) cancelAnimationFrame(animationId);
            animate();
        }

        function resumeAudioContext() {
            if (audioContext && audioContext.state === 'suspended') audioContext.resume();
            else if (!audioContext) { setupAudioContext(); audioContext?.resume(); }
        }

        function updateMediaSession() {
            if (!('mediaSession' in navigator)) return;
            if (!playlist.length || !playlist[currentIndex]) return;
            const track = playlist[currentIndex];
            navigator.mediaSession.metadata = new MediaMetadata({
                title: track.title,
                artist: track.artist,
                album: 'Heart Collection'
            });
        }

        function loadTrack(index) {
            if (!playlist.length || index < 0 || index >= playlist.length) return false;
            const track = playlist[index];
            currentIndex = index;
            if (audio.src !== track.fileUrl) {
                audio.src = track.fileUrl;
                audio.load();
            }
            currentSongTitleSpan.textContent = track.title;
            currentSongArtistSpan.textContent = track.artist;
            albumTextDiv.innerHTML = `🎧 ${track.title}<br>🎶 ${track.artist}`;
            totalDurationSpan.textContent = track.duration || "0:00";
            progressFill.style.width = '0%';
            currentTimeSpan.textContent = "0:00";
            updateActiveClass();
            updateMediaSession();
            return true;
        }

        function updateActiveClass() {
            document.querySelectorAll('.playlist-item').forEach((item, idx) => {
                if (idx === currentIndex) item.classList.add('active');
                else item.classList.remove('active');
            });
        }

        async function playCurrent() {
            if (!playlist.length || !playlist[currentIndex]?.fileUrl) {
                if (playlist[currentIndex] && !playlist[currentIndex].fileUrl) {
                    alert(`No audio URL for "${playlist[currentIndex].title}". Please check the song list.`);
                }
                return;
            }
            resumeAudioContext();
            try {
                await audio.play();
                isPlaying = true;
                playIcon.classList.remove('fa-play');
                playIcon.classList.add('fa-pause');
                updateMediaSession();
            } catch(e) { console.warn(e); }
        }

        function pauseCurrent() {
            audio.pause();
            isPlaying = false;
            playIcon.classList.remove('fa-pause');
            playIcon.classList.add('fa-play');
        }

        function togglePlayPause() {
            if (!playlist.length) return;
            if (isPlaying) pauseCurrent();
            else playCurrent();
        }

        function nextTrack() {
            if (!playlist.length) return;
            let newIndex;
            if (shuffleMode) {
                do { newIndex = Math.floor(Math.random() * playlist.length); }
                while (newIndex === currentIndex && playlist.length > 1);
            } else {
                newIndex = (currentIndex + 1) % playlist.length;
            }
            loadTrack(newIndex);
            if (isPlaying) playCurrent();
        }

        function prevTrack() {
            if (!playlist.length) return;
            let newIndex = (currentIndex - 1 + playlist.length) % playlist.length;
            loadTrack(newIndex);
            if (isPlaying) playCurrent();
        }

        function updateProgress() {
            if (audio.duration && !isNaN(audio.duration)) {
                const percent = (audio.currentTime / audio.duration) * 100;
                progressFill.style.width = `${percent}%`;
                currentTimeSpan.textContent = formatTime(audio.currentTime);
                if (!totalDurationSpan.textContent || totalDurationSpan.textContent === "0:00") {
                    totalDurationSpan.textContent = formatTime(audio.duration);
                }
            }
        }

        function setProgress(e) {
            const rect = progressContainer.getBoundingClientRect();
            const percent = (e.clientX - rect.left) / rect.width;
            if (audio.duration) audio.currentTime = percent * audio.duration;
        }

        function updateVolume() { audio.volume = volumeSlider.value / 100; }

        function renderPlaylist() {
            playlistDiv.innerHTML = '';
            if (playlist.length === 0) {
                playlistDiv.innerHTML = '<div class="empty-playlist-msg">🎵 No songs loaded</div>';
                totalSongsCountSpan.innerText = '0';
                return;
            }
            totalSongsCountSpan.innerText = playlist.length;
            playlist.forEach((track, idx) => {
                const item = document.createElement('div');
                item.className = `playlist-item ${idx === currentIndex ? 'active' : ''}`;
                item.innerHTML = `
                    <div class="song-title-artist">
                        <div class="title">${escapeHtml(track.title)}</div>
                        <div class="artist">${escapeHtml(track.artist)}</div>
                    </div>
                    <div class="duration">${track.duration || '--:--'}</div>
                    <button class="edit-song" data-idx="${idx}" title="edit title/artist"><i class="fas fa-pen"></i></button>
                    <button class="remove-song" data-idx="${idx}" title="remove from playlist"><i class="fas fa-trash-alt"></i></button>
                `;
                item.addEventListener('click', (e) => {
                    if (e.target.closest('.edit-song') || e.target.closest('.remove-song')) return;
                    if (track.fileUrl && (track.fileUrl.startsWith('http') || track.fileUrl.startsWith('blob:'))) {
                        loadTrack(idx);
                        if (!isPlaying) playCurrent(); else playCurrent();
                    } else {
                        alert(`🎵 No playable URL for "${track.title}". Please check the song list.`);
                    }
                });
                playlistDiv.appendChild(item);
            });
            attachItemEvents();
        }

        function attachItemEvents() {
            document.querySelectorAll('.edit-song').forEach(btn => {
                btn.removeEventListener('click', handleEdit);
                btn.addEventListener('click', handleEdit);
            });
            document.querySelectorAll('.remove-song').forEach(btn => {
                btn.removeEventListener('click', handleRemove);
                btn.addEventListener('click', handleRemove);
            });
        }

        function handleEdit(e) {
            e.stopPropagation();
            const idx = parseInt(e.currentTarget.getAttribute('data-idx'));
            const track = playlist[idx];
            const newTitle = prompt("Edit song title:", track.title);
            const newArtist = prompt("Edit artist name:", track.artist);
            if (newTitle !== null) playlist[idx].title = newTitle.slice(0, 50);
            if (newArtist !== null) playlist[idx].artist = newArtist.slice(0, 40);
            renderPlaylist();
            if (currentIndex === idx) {
                currentSongTitleSpan.textContent = playlist[idx].title;
                currentSongArtistSpan.textContent = playlist[idx].artist;
                albumTextDiv.innerHTML = `🎧 ${playlist[idx].title}<br>🎶 ${playlist[idx].artist}`;
                updateMediaSession();
            }
        }

        function handleRemove(e) {
            e.stopPropagation();
            const idx = parseInt(e.currentTarget.getAttribute('data-idx'));
            const wasPlaying = isPlaying && currentIndex === idx;
            if (wasPlaying) pauseCurrent();
            playlist.splice(idx, 1);
            if (playlist.length === 0) {
                currentIndex = 0;
                audio.src = '';
                currentSongTitleSpan.textContent = 'no songs';
                currentSongArtistSpan.textContent = 'add MP3 files';
                albumTextDiv.innerHTML = '🎵❤️ add music';
                if ('mediaSession' in navigator) navigator.mediaSession.metadata = null;
            } else {
                if (currentIndex >= idx) currentIndex = Math.max(0, currentIndex - 1);
                loadTrack(currentIndex);
                if (wasPlaying) playCurrent();
            }
            renderPlaylist();
        }

        function escapeHtml(str) {
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        // Optional manual file upload (kept as fallback)
        function addSongsFromFiles(files) {
            if (!files.length || !playlist.length) return;
            let assignIndex = 0;
            for (let i = 0; i < playlist.length && assignIndex < files.length; i++) {
                if (!playlist[i].fileUrl || !playlist[i].fileUrl.startsWith('http')) {
                    const file = files[assignIndex];
                    if (file.type.includes('audio')) {
                        if (playlist[i].fileUrl && playlist[i].fileUrl.startsWith('blob:')) URL.revokeObjectURL(playlist[i].fileUrl);
                        const blobUrl = URL.createObjectURL(file);
                        playlist[i].fileUrl = blobUrl;
                        const tempAudio = new Audio();
                        tempAudio.src = blobUrl;
                        tempAudio.addEventListener('loadedmetadata', () => {
                            if (tempAudio.duration && isFinite(tempAudio.duration)) {
                                playlist[i].duration = formatTime(tempAudio.duration);
                                renderPlaylist();
                            }
                        });
                        assignIndex++;
                    }
                }
            }
            renderPlaylist();
            if (playlist.length && !audio.src && playlist[0].fileUrl) {
                loadTrack(0);
            }
        }

        // FIXED: Use the pre‑provided URL from songList
        function initPlaylistFromList() {
            playlist = songList.map(song => ({
                title: song.title,
                artist: song.artist,
                duration: song.duration,
                fileUrl: song.url || null   // now the URLs are used!
            }));
            totalSongsCountSpan.innerText = playlist.length;
            renderPlaylist();
            if (playlist.length && playlist[0].fileUrl) {
                loadTrack(0);
                currentSongTitleSpan.textContent = playlist[0].title;
                currentSongArtistSpan.textContent = playlist[0].artist;
            } else {
                currentSongTitleSpan.textContent = "select a song";
                currentSongArtistSpan.textContent = "click any track, then add MP3";
            }
        }

        function toggleShuffle() {
            shuffleMode = !shuffleMode;
            shuffleBtn.style.boxShadow = shuffleMode ? "0 0 8px #d4a373" : "";
        }

        function initEvents() {
            playPauseBtn.addEventListener('click', togglePlayPause);
            prevBtn.addEventListener('click', prevTrack);
            nextBtn.addEventListener('click', nextTrack);
            shuffleBtn.addEventListener('click', toggleShuffle);
            volumeSlider.addEventListener('input', updateVolume);
            audio.addEventListener('timeupdate', updateProgress);
            audio.addEventListener('ended', nextTrack);
            progressContainer.addEventListener('click', setProgress);
            audio.addEventListener('play', () => {
                isPlaying = true;
                playIcon.classList.remove('fa-play');
                playIcon.classList.add('fa-pause');
                resumeAudioContext();
                updateMediaSession();
            });
            audio.addEventListener('pause', () => {
                isPlaying = false;
                playIcon.classList.remove('fa-pause');
                playIcon.classList.add('fa-play');
            });
            addSongsBtn.addEventListener('click', () => songFileInput.click());
            songFileInput.addEventListener('change', (e) => {
                if (e.target.files.length) addSongsFromFiles(Array.from(e.target.files));
                songFileInput.value = '';
            });
            if ('mediaSession' in navigator) {
                navigator.mediaSession.setActionHandler('play', () => playCurrent());
                navigator.mediaSession.setActionHandler('pause', () => pauseCurrent());
                navigator.mediaSession.setActionHandler('previoustrack', () => prevTrack());
                navigator.mediaSession.setActionHandler('nexttrack', () => nextTrack());
            }
        }

        function idleBars() {
            function animateIdle() {
                if (!audio.paused || !barsArray.length) return;
                for (let i = 0; i < barsArray.length; i++) {
                    const h = 8 + Math.sin(Date.now() / 350 + i) * 14;
                    barsArray[i].style.height = `${Math.max(6, h)}px`;
                }
                requestAnimationFrame(animateIdle);
            }
            animateIdle();
        }

        function start() {
            initBars();
            initEvents();
            initPlaylistFromList();
            updateVolume();
            if (!audioContext) {
                document.body.addEventListener('click', function initCtx() {
                    if (audioContext && audioContext.state === 'suspended') audioContext.resume();
                    else if (!audioContext) setupAudioContext();
                }, { once: true });
            }
            idleBars();
        }
        start();
    })();
</script>
</body>
</html>
